# ---------------------------------------------------------------------------
# Agent Commerce Gateway - ty-transcriber configuration
#
# Exposes ty-transcriber's stored transcripts to AI agents over HTTP and MCP.
# Agents need no account: every retrieval is paid per call with 0.01 USDC
# via x402 (EIP-3009 transferWithAuthorization). Funds settle directly to
# the merchant wallet; the gateway holds no keys.
#
# Copy to `agent-commerce/config.yaml`, set the env vars (see .env.example
# at the gateway checkout), then validate and start:
#
#   npx @devlab.group/agent-commerce validate --config agent-commerce/config.yaml
#   npx @devlab.group/agent-commerce start --config agent-commerce/config.yaml
#
# `${VAR}` placeholders are resolved from the environment at load time.
# ---------------------------------------------------------------------------

version: 1

merchant:
  id: ty-transcriber
  name: TY Transcriber
  publicBaseUrl: ${GATEWAY_PUBLIC_BASE_URL:-http://localhost:8080}

server:
  port: ${GATEWAY_PORT:-8080}
  host: 0.0.0.0
  # Operator routes (receipts, events) 404 without this. Set it before
  # exposing the gateway anywhere but localhost.
  # adminToken: ${ADMIN_TOKEN}

storage:
  receipts:
    driver: sqlite
    path: ${RECEIPT_STORE_PATH:-./data/receipts.sqlite}

protocols:
  http:
    enabled: true
  mcp:
    enabled: true
    mountPath: /mcp

resources:
  # Paid per-call retrieval: no account, just 0.01 USDC per transcript.
  transcript_get:
    name: YouTube Transcript
    description: >
      Retrieve a stored YouTube transcript by id. Returns the full
      transcript text plus title, channel and source URL metadata.
    input:
      type: object
      properties:
        id:
          type: string
          description: Transcript id (e.g. the YouTube video id)
      required: [id]
      additionalProperties: false
    backend:
      type: http
      method: GET
      url: ${MERCHANT_API_BASE_URL:-http://localhost:3000}/api/agent/transcripts/{id}
      timeoutMs: 10000
    pricing:
      type: fixed
      amount: "0.01" # decimal string, never a float
      currency: USDC
    expose: [http, mcp]
    payments: [x402]
    mimeType: application/json

payments:
  x402:
    enabled: true

    # Base Sepolia by default. Mainnet is eip155:8453 and additionally
    # requires allowMainnet: true plus the production guardrails.
    network: ${X402_NETWORK:-eip155:84532}

    # Only used for health checks here; the facilitator does the chain work.
    rpcUrl: ${X402_RPC_URL:-https://base-sepolia-rpc.publicnode.com}

    # Circle's USDC on Base Sepolia. EIP-712 domain ("USDC", "2"), 6 decimals.
    # On Base mainnet: asset 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913,
    # assetName "USD Coin".
    asset: ${X402_ASSET:-0x036CbD53842c5426634e7929541eC2318f3dCF7e}
    assetName: ${X402_ASSET_NAME:-USDC}
    assetVersion: ${X402_ASSET_VERSION:-"2"}
    assetDecimals: 6

    # Merchant-controlled settlement destination. NEVER a gateway-owned
    # wallet and never a development address.
    payTo: ${MERCHANT_WALLET}

    maxTimeoutSeconds: 300

    facilitator:
      mode: remote
      url: ${X402_FACILITATOR_URL:-https://x402.org/facilitator}
      # The public testnet facilitator takes no credential. Use
      # `type: bearer` with `token: ${...}` in production.
      auth:
        type: none
